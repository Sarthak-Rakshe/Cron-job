name: Cron Pinger (every 13 minutes)

on:
  schedule:
    - cron: "5,18,31,44,57 * * * *"
      timezone: "Etc/UTC"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cron-pinger
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TIMEOUT_MS: "120000"
      METHOD: GET
      # TARGET_URL must be provided via repo/org secret
      TARGET_URL: ${{ secrets.TARGET_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run pinger
        run: node scripts/ping.js
